apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ai-devops-agent.fullname" . }}-audit-log
  labels:
    {{- include "ai-devops-agent.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.auditLogs.size }}
