apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-devops-agent.serviceAccountName" . }}
  labels:
    {{- include "ai-devops-agent.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ai-devops-agent.fullname" . }}
  labels:
    {{- include "ai-devops-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ai-devops-agent.fullname" . }}
  labels:
    {{- include "ai-devops-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ai-devops-agent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ai-devops-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
