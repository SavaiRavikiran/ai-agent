# Template for secrets - use External Secrets Operator or kubectl create secret
# Example: kubectl create secret generic ai-devops-agent-secrets \
#   --from-literal=SNOW_BASE_URL=... --from-literal=SNOW_PASSWORD=... ...
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-devops-agent.fullname" . }}-secrets
  labels:
    {{- include "ai-devops-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  # SNOW_BASE_URL: ""
  # SNOW_PASSWORD: ""
  # ELASTICSEARCH_PASSWORD: ""
  # INTERNAL_API_TOKEN: ""
