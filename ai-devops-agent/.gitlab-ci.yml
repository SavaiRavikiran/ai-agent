stages:
  - test
  - build
  - security-scan
  - deploy-staging
  - deploy-prod

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  DOCKER_IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest

test:
  stage: test
  image: python:3.11
  before_script:
    - pip install poetry
    - poetry config virtualenvs.in-project true
    - poetry install
  script:
    - poetry run pytest tests/ -v --cov=. --cov-fail-under=70
    - poetry run bandit -r agent tools rag api config -ll
    - poetry run safety check --json || true
  coverage: '/TOTAL.*\s+(\d+%)/'

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build --no-cache -t $DOCKER_IMAGE -t $DOCKER_IMAGE_LATEST .
    - docker push $DOCKER_IMAGE
    - docker push $DOCKER_IMAGE_LATEST
  only:
    - main
    - develop

security-scan:
  stage: security-scan
  image: aquasec/trivy:latest
  dependencies:
    - build
  script:
    - trivy image --exit-code 1 --severity CRITICAL $DOCKER_IMAGE
  allow_failure: false

deploy-staging:
  stage: deploy-staging
  script:
    - helm upgrade --install ai-devops-agent ./k8s/helm -n ai-agent -f k8s/helm/values.yaml --set image.tag=$CI_COMMIT_SHA
    - kubectl rollout status deployment/ai-devops-agent -n ai-agent --timeout=300s
  environment:
    name: staging
  when: manual

deploy-prod:
  stage: deploy-prod
  script:
    - helm upgrade --install ai-devops-agent ./k8s/helm -n production -f k8s/helm/values.yaml --set image.tag=$CI_COMMIT_SHA
    - kubectl rollout status deployment/ai-devops-agent -n production --timeout=300s
  environment:
    name: production
  when: manual
  only:
    - main
