# Local development: Ollama, Milvus, MinIO, etcd, optional ai-agent
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # GPU optional: add deploy block with nvidia driver for Linux
  milvus:
    image: milvusdb/milvus:v2.4.0
    ports:
      - "19530:19530"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      - etcd
      - minio
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
    volumes:
      - etcd-data:/etcd
  minio:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    command: minio server /minio_data
    volumes:
      - minio-data:/minio_data
  # Uncomment to run agent in dev:
  # ai-agent:
  #   build: .
  #   ports:
  #     - "8080:8080"
  #   env_file: .env
  #   depends_on:
  #     - ollama
  #     - milvus

volumes:
  ollama-data:
  etcd-data:
  minio-data:
