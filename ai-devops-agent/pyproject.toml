[tool.poetry]
name = "ai-devops-agent"
version = "1.0.0"
description = "Production-ready on-premise AI DevOps Agent"
authors = ["DevOps Team"]
readme = "README.md"
packages = [{include = "agent"}, {include = "tools"}, {include = "rag"}, {include = "watcher"}, {include = "api"}, {include = "config"}]

[tool.poetry.dependencies]
python = "^3.11"
langgraph = ">=0.2.0"
langchain = ">=0.3.0"
langchain-community = ">=0.3.0"
langchain-ollama = ">=0.2.0"
langchain-milvus = ">=0.1.0"
pymilvus = {version = ">=2.4.0", extras = ["milvus_lite"]}
paramiko = ">=3.4.0"
kubernetes = ">=29.0.0"
elasticsearch = ">=8.0.0"
requests = ">=2.31.0"
httpx = ">=0.27.0"
pydantic = ">=2.7.0"
pydantic-settings = ">=2.3.0"
python-dotenv = ">=1.0.0"
schedule = ">=1.2.0"
fastapi = ">=0.111.0"
uvicorn = ">=0.30.0"
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
python-jose = ">=3.3.0"
structlog = ">=24.0.0"
click = ">=8.1.0"
gitpython = ">=3.1.0"
setuptools = ">=65.0.0,<70"

[tool.poetry.group.dev.dependencies]
pytest-cov = ">=4.0.0"
bandit = ">=1.7.0"
safety = ">=3.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["agent", "tools", "rag", "watcher", "api", "config"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 70
